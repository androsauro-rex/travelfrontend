<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="stylesheet" href="style/login.css" />
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Slackey&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Indie+Flower&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container-login-general">
      <!-- From Uiverse.io by ayyjayy2 -->
      <form class="form">
        <div class="title">Benvenuto!<br /><span>Sei pronto? Accedi per continuare</span></div>
        <input class="input" name="email" placeholder="Email" type="email" id="email" required/>
        <input
          class="input"
          name="password"
          placeholder="Password"
          type="password"
          id="password"
          minlength="6"
          maxlength="12"
          required
        />
        <button class="button-confirm" disabled id="btn">Accedi :D →</button>
        <div class="registrazione-div">

          <p>Non hai ancora un account? <a class="link" href="registrazione.html">Registrati qui!</a></p>
        </div>
      </form>
    </div>

    <script src="script/login.js"></script>
  </body>
</html>
