<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Registrazione TravelBuddy</title>

  <link rel="stylesheet" href="style/registrazione.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800;900&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">

</head>

<body>

  <div class="registration-container">

    <!-- HEADER -->
    <div class="registration-header">
      <h1>Travel<span>Buddy</span></h1>
      <p class="registration-subtitle">Crea il tuo account</p>
    </div>

    <!-- SOCIAL -->
    <div class="social-section">
      <p class="social-title">Registrati con</p>
      <div class="social-buttons">
        <a href="https://accounts.google.com" target="_blank" class="social-btn google-btn">
          <img src="assets/google.png" alt="Google">
        </a>
        <a href="https://www.facebook.com" target="_blank" class="social-btn fb-btn">
          <img src="assets/fb.png" alt="Facebook">
        </a>
        <a href="https://www.instagram.com" target="_blank" class="social-btn instagram-btn">
          <img src="assets/instagram.png" alt="Instagram">
        </a>
      </div>
    </div>

    <div class="divider">
      <span>Oppure registrati con email</span>
    </div>

    <!-- FORM -->
    <form class="registration-form">

      <div class="form-row">
        <div class="form-group">
          <label>Nome</label>
          <input id="nome" type="text" placeholder="Mario" required maxlength="128">
        </div>

        <div class="form-group">
          <label>Cognome</label>
          <input id="cognome" type="text" placeholder="Rossi" required maxlength="128">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Nickname</label>
          <input id="nickname" type="text" placeholder="mario_travels" required minlength="3" maxlength="50">
        </div>

        <div class="form-group">
          <label>Età</label>
          <input id="eta" type="number" placeholder="28" required min="18" max="120">
        </div>
      </div>

      <div class="form-group full-width">
        <label>Email</label>
        <input id="email" type="email" placeholder="mario@example.com" required>
      </div>

      <div class="form-group full-width">
        <label>Password</label>
        <input id="password" type="password" placeholder="Min. 6 caratteri" required minlength="6" maxlength="20">
      </div>

      <!-- CHECKBOX -->
      <div class="checkbox-group">
        <label class="checkbox-label">
          <input type="checkbox" required>
          <span>Accetto i <a href="#" class="link">termini e condizioni</a></span>
        </label>
      </div>

      <!-- BUTTON -->
      <button type="submit" class="btn-register">Registrati</button>

      <!-- LOGIN -->
      <p class="login-text">Hai già un account? <a href="login.html" class="link">Accedi qui</a></p>

    </form>

  </div>

  <script src="script/registrazione.js"></script>

</body>

</html>
