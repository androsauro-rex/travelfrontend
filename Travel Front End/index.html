<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TravelBuddy</title>
    <link rel="stylesheet" href="style/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Slackey&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Indie+Flower&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container-general">
       <div class="title-header">
        <div class="split-text-container">
          <span class="text-part left" style="color:#fee440">Travel</span>
          <span class="text-part right" style="color: #00bbf9">Buddy</span>
        </div>
      </div>
      <!-- HEADER SECTION -->
      <div class="container-header">
        <div class="header-section">
          <!-- RIGHT SIDE HERO -->
          <div class="right-header">
            <div class="logo">
              <img src="assets/logo-esempio.png" alt="logo" />
            </div>
          </div>
          <!-- LEFT SIDE HERO -->
          <div class="left-header">
            <div class="slogan">
              <p>
                L'amico di viaggio che non dimentica mai nulla <br />
                <span style="color: rgb(194, 56, 56)">(a differenza tua)</span>
              </p>
            </div>
            <div class="button-header">
              <!-- From Uiverse.io by himanshu9682 -->
              <div class="container">
                <a href="#" class="button type--C">
                  <div class="button__line"></div>
                  <div class="button__line"></div>
                  <span class="button__text">Accedi</span>
                  <div class="button__drow1"></div>
                  <div class="button__drow2"></div>
                </a>
              </div>
              <div class="container">
                <a href="#" class="button type--C">
                  <div class="button__line"></div>
                  <div class="button__line"></div>
                  <span class="button__text">Registrati</span>
                  <div class="button__drow1"></div>
                  <div class="button__drow2"></div>
                </a>
              </div>
            </div>
          </div>
        </div>
      </div>
     
      <!-- CARDS SECTION -->
       <div class="cards-container">
        
       </div>


    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
