    <div class="container-fluid container-general">
      <div class="container-fluid navbar">
        <div class="logo-div">

        </div>
        <div class="title-nav">

        </div>

            L'amico di viaggio che non dimentica mai nulla! (a differenza tua)
          </h4>
        </div>
        </div>

        <div class="border-separator mt-4"></div>

        <div class="container-fluid box-trips mt-5">
          <div class="cards-grid">
            <div class="cards-title">
              <h3>Gli itinerari più popolari consigliati per te:</h3>
            </div>
            <div class="container-cards">
              <div class="trip-card">
                <div class="img-card">
                  <img src="assets/Reggio Calabria.jpg" alt="">
                </div>
                <div class="bottom-card">
                  <div class="text-card">
                    <h6>Un weekend a Reggio Calabria</h6>
                    <p>Tra un tramonto sullo Stretto e un gelato, forse dovevo restare un giorno in più.</p>
                  </div>
                  <div class="button-card">
                    <button type="button" class="btn btn-primary">Guarda l'itinerario</button>
                  </div>

                </div>
              </div>

            </div>
          </div>

        </div>
      
    </div>
